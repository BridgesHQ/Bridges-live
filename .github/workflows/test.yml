name: test
on:
  push:
  pull_request:
jobs:
  bridges-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  listingreel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listingreel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: listingreel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx next build   # must build with no secrets set (Vercel's first build)
        env:
          NEXT_TELEMETRY_DISABLED: 1
